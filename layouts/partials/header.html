<head>
  <title>{{ .Site.Title }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ with .Site.Params.description }}{{ . }}{{ end }}">
  <meta name="author" content="{{ with .Site.Params.name }}{{ . }}{{ end }}">
  {{ .Hugo.Generator }}
  {{ if .Site.Params.favicon_ico }}
    <link rel="icon" href="/images/icons/{{ .Site.Params.favicon_ico  }}" type="image/x-icon" {{ if .Site.Params.favicon_ico_sizes }}sizes="{{ .Site.Params.favicon_ico_sizes  }}"{{ end }} />
  {{ end }}
  {{ if .Site.Params.favicon_png }}
    <link rel="icon" href="/images/icons/{{ .Site.Params.favicon_png  }}" type="image/png" {{ if .Site.Params.favicon_png_sizes }}sizes="{{ .Site.Params.favicon_png_sizes  }}"{{ end }} />
  {{ end }}
  {{ if .Site.Params.favicon_svg }}
    <link rel="icon" href="/images/icons/{{ .Site.Params.favicon_svg  }}" type="image/svg+xml" sizes="any" />
  {{ end }}
  {{ if .Site.Params.appleicon }}
  <link rel="apple-touch-icon-precomposed" href="/images/icons/{{ .Site.Params.appleicon  }}" />
 {{ end }}
 <link rel="canonical" href="{{ .Permalink }}">
  <style>

/* Reset */
html,
body,
div,
span,
applet,
object,
iframe,
h1,
h2,
h3,
h4,
h5,
h6,
p,
blockquote,
pre,
a,
abbr,
acronym,
address,
big,
cite,
code,
del,
dfn,
em,
img,
ins,
kbd,
q,
s,
samp,
small,
strike,
strong,
sub,
sup,
tt,
var,
b,
u,
i,
center,
dl,
dt,
dd,
ol,
ul,
li,
fieldset,
form,
label,
legend,
table,
caption,
tbody,
tfoot,
thead,
tr,
th,
td,
article,
aside,
canvas,
details,
embed,
figure,
figcaption,
footer,
header,
hgroup,
menu,
nav,
output,
ruby,
section,
summary,
time,
mark,
audio,
video {
  margin: 0;
  padding: 0;
  border: 0;
  font-size: 100%;
  font: inherit;
  vertical-align: baseline;
}

article,
aside,
details,
figcaption,
figure,
footer,
header,
hgroup,
menu,
nav,
section {
  display: block;
}

body {
  line-height: 1;
}

ol,
ul {
  list-style: none;
}

blockquote,
q {
  quotes: none;
}

blockquote:before,
blockquote:after,
q:before,
q:after {
  content: '';
  content: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

body {
  font-size: 150% !important;
  -webkit-text-size-adjust: none;
}


/* Box Model */

*,
*:before,
*:after {
  -moz-box-sizing: border-box;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}


/* Type */

body,
input,
select,
textarea {
  color: #444;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
  font-size: 14pt;
  font-weight: 400;
  line-height: 1.6;
}

@media screen and (max-width: 1680px) {
  body,
  input,
  select,
  textarea {
    font-size: 11pt;
  }
}

@media screen and (max-width: 480px) {
  body,
  input,
  select,
  textarea {
    font-size: 10pt;
    line-height: 1.3;
  }
}

a {
  transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  color: inherit;
  text-decoration: none;
  border-bottom: 2px solid #ef203d
}

a:before {
  transition: color 0.2s ease, text-shadow 0.2s ease;
}

a:hover {
  color: #131840;
  background-color: #ef203d;
  text-decoration: none;
}

strong,
b {
  color: #313f47;
  font-weight: bold;
}

em,
i {
  font-style: italic;
  color: #ef203d;
}

p {
  margin: 0 0 1.3em 0;
}

h1,
h2,
h3,
h4,
h5,
h6 {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
  font-weight: 700;
  color: #131840;
  line-height: 1.5;
  margin: 0 0 1em 0;
}

h1 a,
h2 a,
h3 a,
h4 a,
h5 a,
h6 a {
  color: inherit;
  text-decoration: none;
}

h1 {
  font-size: 2em;
  letter-spacing: -0.035em;
  margin: 0 0 0.5em 0;
}

h2 {
  font-size: 1em;
}

h3 {
  font-size: 1em;
}

h4 {
  font-size: 1em;
}

h5 {
  font-size: 0.7em;
}

li {
  font-size: 0.85em;
}

h6,
.biography {
  font-size: 0.7em;
}

sub {
  font-size: 0.8em;
  position: relative;
  top: 0.5em;
}

sup {
  font-size: 0.8em;
  position: relative;
  top: -0.5em;
}

hr {
  border: 0;
  border-bottom: solid 1px #444;
  margin: 1.5em 0;
}


/* Icon */

.icon {
  text-decoration: none;
  position: relative;
  border-bottom: none;
}

.icon:before {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  font-family: FontAwesome;
  font-style: normal;
  font-weight: normal;
  text-transform: none !important;
}

.icon>.label {
  display: none;
}


/* List */

ol {
  list-style: decimal;
  margin: 0 0 1.5em 0;
  padding-left: 1.25em;
}

ol li {
  padding-left: 0.25em;
}

ul {
  list-style: none;
  margin: 0 0 1.125em 0;
}

ul li {
  padding-bottom: 0.375em;
}

ul.alt {
  padding-left: 0;
}

ul.alt li {
  border-top: solid 1px #9EA3A2;
  padding: 0.5em 0;
}

ul.alt li:first-child {
  border-top: 0;
  padding-top: 0;
}

ul.icons {
  cursor: default;
  list-style: none;
  padding-left: 0;
}

ul.icons li {
  display: inline-block;
  padding: 0.5em 0.3em;
}

ul.icons li a {
  box-sizing: content-box;
  text-decoration: none;
  position: relative;
  display: block;
  width: 2.5em;
  height: 2.5em;
  border-radius: 100%;
  border: solid 2px #ef203d;
  line-height: 2.5em;
  overflow: hidden;
  text-align: center;
  text-indent: 3em;
  white-space: nowrap;
}

@font-face {
    font-family: 'FontAwesome';
    src: url('/assets/fonts/fontawesome-webfont.eot?v=4.4.0');
    src: url('/assets/fonts/fontawesome-webfont.eot?#iefix&v=4.4.0') format('embedded-opentype'), url('/assets/fonts/fontawesome-webfont.woff2?v=4.4.0') format('woff2'), url('/assets/fonts/fontawesome-webfont.woff?v=4.4.0') format('woff'), url('/assets/fonts/fontawesome-webfont.ttf?v=4.4.0') format('truetype'), url('/assets/fonts/fontawesome-webfont.svg?v=4.4.0#fontawesomeregular') format('svg');
    font-weight: normal;
    font-style: normal
}

ul.icons li a:before {
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  font-family: FontAwesome;
  font-style: normal;
  font-weight: normal;
  text-transform: none !important;
}

ul.icons li a:before {
  font-size: 2em;
  color: #ef203d;
}

ul.icons li a:hover:before {
  color: #131840;
}

ul.icons li a:before {
  position: absolute;
  top: 0;
  left: 0;
  width: inherit;
  height: inherit;
  font-size: 1.85rem;
  line-height: inherit;
  text-align: center;
  text-indent: 0;
}

ul.icons li a:hover {
  border-color: #ef203d;
}

@media screen and (max-width: 480px) {
  ul.icons li a:before {
    font-size: 1.5rem;
  }
}

ul.actions {
  cursor: default;
  list-style: none;
  padding-left: 0;
}

ul.actions li {
  display: inline-block;
  /* padding: 0 0.75em 0 0; */
  vertical-align: middle;
}

ul.actions li:last-child {
  padding-right: 0;
}

dl {
  margin: 0 0 1.5em 0;
}

dl dt {
  display: block;
  margin: 0 0 0.75em 0;
}

dl dd {
  margin-left: 1.5em;
}


/* Main */

#main {
  position: relative;
  max-width: 100%;
  min-width: 27em;
  background: #ffffff;
  border-radius: 10px;
  text-align: center;
  display: flex;
  flex-flow: row-reverse nowrap;
  align-items: stretch;
  justify-content: center;
}

#main:after {
  border-bottom: 30px solid #131840;
  content: "";
  display: block;
  position: absolute;
  z-index: -1;
  bottom: -8px;
  width: 100%;
  left: 0;
  right: 0;
  border-bottom-left-radius: 10px;
  border-bottom-right-radius: 10px;
}

#main #main-photo {
  background-position: 53% 50%;
  background-repeat: no-repeat;
  background-size: cover;
  background-image: url(assets/images/engy4.jpg);
  flex: 1 1 60%;
  border-radius: 0 8px 8px 0;
  min-width: 250px;
}

#main>section {
  padding: 2em;
  text-align: left;
  flex: 1 1 40%;
  display: flex;
  flex-flow: column nowrap;
  justify-content: center;
}

#main .name {
  font-weight: bold;
  white-space: nowrap;
}

#main .location {
  display: block;
  margin-top: -1.5em;
  margin-bottom: 1.5em;
}

#main .biography {
  display: block;
  margin-bottom: 1.5em;
}


/* Footer */

#footer {
  align-self: flex-end;
  width: 100%;
  padding: 1.5em 0 0 0;
  color: rgba(0, 0, 0, 0.1);
  cursor: default;
  text-align: center;
}

#footer .copyright {
  margin: 0;
  padding: 0;
  font-size: 0.7em;
  list-style: none;
  font-weight: bold;
}

#footer .copyright li {
  display: inline-block;
  margin: 0 0 0 0.45em;
  padding: 0 0 0 0.85em;
  border-left: solid 1px rgba(255, 255, 255, 0.5);
  line-height: 1;
}

#footer .copyright li:first-child {
  border-left: 0;
}


/* Wrapper */

#wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
  min-height: 100%;
  padding: 0.5em;
  z-index: 2;
}

body.is-ie #wrapper {
  height: 100%;
}

@media screen {
  html,
  body {
    min-width: 320px;
  }
}

html {
  height: 100%;
}

body {
  height: 100%;
  background-color:rgb(239,32,61,1);
  background-image: linear-gradient(0deg, rgba(239,32,61, 0.93) 0%, rgba(239,32,61, 0.8) 100%), url("assets/images/escheresque-dark.png");
 background-repeat: no-repeat, repeat;
  background-size: cover, auto;
  background-position: center center, bottom center;
  background-attachment: fixed, fixed;
}

@media screen and (max-width: 960px) {
  #main {
    min-width: 0;
    max-width: 100%;
    width: 100%;
    display: block;
  }
  #main-photo {
    padding-bottom: 50%;
    box-shadow: inset 0 -130px 200px -50px rgba(0, 0, 0, .5);
    border-top-left-radius: 8px !important;
    border-bottom-left-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
  }
}

@media screen and (max-width: 600px) {
  #main .name {
    font-size: 1.3em;
    margin-bottom: 0.75em;
  }
  h2 {
    font-size: .8em;
  }
  h5 {
    font-size: .6em;
  }
  #main>section {
    padding: 1em;
  }
}

@media screen {
  html,
  body {
    min-width: 320px;
  }
}

@media screen and (max-width: 380px) {
  #main .name {
    white-space: normal;
    line-height: 1.3;
  }
}
