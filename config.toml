    avatar = "engy.jpg"
    position = "UX Design & Front-End development"
    livesIn = "[Paris, France](https://en.parisinfo.com/)"
    # scope = [
    #     "Product team @ [armstrong](http://byarmstrong.com)"
    #   ]
    biography = """Hey, I’m _Enguerrand_! I’m an __independent programmer__.

In the past, I've occupied various positions at __web agencies__ and, more recently, I was part of the product team at __[armstrong](http://byarmstrong.com)__.

I'm __37__, married and father of one 👧🏼 . I play a lot of __videogames__ 🎮  , download a considerable amount of __podcasts__ daily, and drink loads of ☕.

I love __music__ (particularly 🎹 ) and, sometimes, I blog about discoveries and favorites at __[geogaddi.com](https://geogaddi.com)__.

I'm currently available for new technology-related project. You can contact me at __enguerrand[at]leclerc[dot]io__ or find me on internet here or there :
"""

